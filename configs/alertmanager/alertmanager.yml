global:
  resolve_timeout: 5m

route:
  receiver: lab-webhook
  group_by:
    - alertname
    - service
    - environment
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="page"
      receiver: lab-webhook
      repeat_interval: 30m

receivers:
  - name: lab-webhook
    webhook_configs:
      - url: http://demo-api:8080/alerts
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - alertname="DemoServiceUnavailable"
    target_matchers:
      - service="demo-api"
    equal:
      - service
      - environment

