global:
  resolve_timeout: 5m

route:
  receiver: authenticated-local-receiver
  group_by: [alertname, service, environment]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers: ['alertname="Watchdog"']
      receiver: authenticated-local-receiver
      group_interval: 1m
      repeat_interval: 1m
    - matchers: ['severity="page"']
      receiver: authenticated-local-receiver
      repeat_interval: 30m

receivers:
  - name: authenticated-local-receiver
    webhook_configs:
      - url: http://alert-receiver:8080/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/receiver_token

inhibit_rules:
  - source_matchers: ['alertname="DemoServiceUnavailable"']
    target_matchers: ['service="demo-api"']
    equal: [service, environment]
